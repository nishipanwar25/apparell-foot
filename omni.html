<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Help - Finance & Accounting</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ===== Header Navbar in Single Line ===== */
        header {
            position: absolute;
            top: 0px;
            left: 0px;
            right: 0px;
            z-index: 10;
            padding: 20px 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Logo */
        .logo img {
            height: 41px;
            filter: drop-shadow(0 0 6px rgba(0, 200, 255, 0.6));
        }

        /* Navigation */
        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }
        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            position: relative;
            transition: color 0.3s ease;
        }
        nav ul li a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 0%;
            height: 2px;
            background: linear-gradient(90deg, #00d4ff, #0077ff);
            transition: width 0.4s ease;
        }
        nav ul li a:hover {
            color: #00d4ff;
        }
        nav ul li a:hover::after {
            width: 100%;
        }

        /* Buy Now Button */
        .btn {
            background: transparent;
            color: #fff;
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s ease;
        }
      
        /* Hero Section */
        .hero-section {
            position: relative;
            height: 100vh;
            min-height: 700px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .hero-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                 rgba(24, 190, 240, 0.85),
                rgba(10, 30, 209, 0.88),
                rgba(0, 0, 5, 0.92)
            );
            z-index: 1;
        }

        /* Hero Title Centered */
        .hero-container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }
       
        .hero-title {
           font-size: 8rem;
    font-weight: 700;
    line-height: 1.1;
    color: white;
    display: flex;
    flex-direction: column;
    position: relative;
    width: 100%;
        }
.hero-title .left {
    align-self: flex-start;
    transform: translateX(-20%);
    transition: transform 0.6s ease-out;
}

.hero-title .right {
    align-self: flex-end;
    transform: translateX(20%);
    transition: transform 0.6s ease-out;
}
        /* Scroll Indicator */
        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            cursor: pointer;
        }
        .scroll-arrow {
            width: 60px;
            height: 60px;
            color: white;
            font-size: 3.2rem;
            background-color: darkblue;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            opacity: 0.7;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        @media (max-width: 768px) {
            .hero-title { font-size: 3rem; }
            nav ul { gap: 15px; }
        }
        @media (max-width: 480px) {
            .hero-title { font-size: 2.2rem; }
            header { flex-direction: column; gap: 10px; }
        }
      
    </style>
</head>
<body>
    <!-- Hero Section -->
    <section class="hero-section">
        <!-- Navbar -->
         <header> 
            <a href="#" class="logo">
                <img src="./images/LOGO/" alt="Tax Help">
            </a>
            <nav>
                <ul>
                    <li><a href="#" data-goto="#demo">Demos</a></li>
                    <li><a href="//tax-help.ancorathemes.com/doc/" target="_blank">Documentation</a></li>
                    <li><a href="//themerex.net/support/" target="_blank">Support</a></li>
                </ul>
            </nav>
            <a href="https://1.envato.market/3PMkOd" target="_blank" class="btn">Buy Now</a>
        </header> 





        

        <!-- Video Background -->
        <video autoplay muted loop playsinline class="hero-video">
            <source src="./Video/omnivid3.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <!-- Overlay -->
        <div class="hero-overlay"></div>

        <!-- Hero Text -->
        <div class="hero-container">
            <h1 class="hero-title">
                <div class="left"><span >Omnichannel</span></div>
                
                <div class="right"><span >E-commerce</span></div>
            </h1>
        </div>

        <!-- Scroll Arrow -->
        <div class="scroll-indicator">
            <div class="scroll-arrow">⬇</div>
        </div>
    </section>

    <!-- Below Section -->
    <section style="height: 100vh; background: #f8f9fa; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #333;">
        <div>
            <h2>Welcome to Tax Help Services</h2>
            <p style="margin-top: 20px; font-size: 1.2rem; text-align: center;">Professional accounting solutions for your business</p>
        </div>
    </section>
   
          <script>
        // Scroll animation for heading
      
        // Smooth scroll on arrow click
        document.querySelector('.scroll-indicator').addEventListener('click', () => {
            window.scrollTo({
                top: window.innerHeight,
                behavior: 'smooth'
            });
        });
        window.addEventListener('scroll', () => {
    const scrollY = window.scrollY;
    if (scrollY < window.innerHeight) {
        document.querySelector('.hero-title .left').style.transform = `translateX(${scrollY * 0.3 - 200}px)`;
        document.querySelector('.hero-title .right').style.transform = `translateX(${-scrollY * 0.3 + 200}px)`;
    }
});

    </script>
</body>
    
</body>
</html>
